spring:
  flyway:
    enabled: false
  datasource:
    url: jdbc:h2:mem:scheduler_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop

scheduler:
  reminder:
    initial-delay-ms: 999999999
    poll-interval-ms: 999999999
    cron: ""

temporal:
  enabled: false
