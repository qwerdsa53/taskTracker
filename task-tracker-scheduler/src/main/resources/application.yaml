spring:
  application:
    name: task-tracker-scheduler
  config:
    # Swarm/Compose secrets mount as files in /run/secrets/.
    import: "optional:configtree:/run/secrets/"
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:25s}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tasktracker}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:create}

springdoc:
  api-docs:
    version: OPENAPI_3_0
  swagger-ui:
    path: /swagger-ui.html
  packages-to-scan: edu.mirea.qwerdsa53.taskTracker.scheduler.admin

app:
  openapi:
    title: Task Tracker Scheduler
    description: Scheduler REST API (jobs, health).
    version: 0.0.1
    redirect-root-to-swagger: true

server:
  port: ${SCHEDULER_SERVER_PORT:8081}
  shutdown: graceful
  tomcat:
    connection-timeout: 5s
    keep-alive-timeout: 15s

scheduler:
  reminder:
    initial-delay-ms: 15000
    poll-interval-ms: 60000
    # Optional cron expression (overrides fixed-delay when set)
    cron: ""

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

# When false, jobs run via Spring scheduler instead of Temporal
temporal:
  enabled: ${TEMPORAL_ENABLED:true}
  target: ${TEMPORAL_TARGET:127.0.0.1:7233}
  namespace: default
  task-queue: task-tracker-reminders
  polling-workflow-id: reminder-polling-global

logging:
  structured:
    format:
      console: ${LOG_STRUCTURED_FORMAT:ecs}
