name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      promote_sha:
        description: 'Git SHA to promote to prod (must already be built and pushed to ghcr)'
        required: true

env:
  IMAGE_API: ghcr.io/${{ github.repository_owner }}/task-tracker-api
  IMAGE_SCHEDULER: ghcr.io/${{ github.repository_owner }}/task-tracker-scheduler

jobs:
  build:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags (API)
        id: meta_api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_API }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Compute image tags (Scheduler)
        id: meta_scheduler
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_SCHEDULER }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta_api.outputs.tags }}
          labels: ${{ steps.meta_api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Scheduler
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.scheduler
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta_scheduler.outputs.tags }}
          labels: ${{ steps.meta_scheduler.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log release info
        if: github.event_name == 'push'
        run: |
          echo "### Release" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| api | \`${{ env.IMAGE_API }}:${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| scheduler | \`${{ env.IMAGE_SCHEDULER }}:${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| run | \`${{ github.run_number }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY

  deploy-prod:
    needs: build
    if: always() && (needs.build.result == 'success' || needs.build.result == 'skipped') && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Resolve image tag to promote
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=sha-${{ github.event.inputs.promote_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: SSH deploy (migrate → stack deploy → smoke)
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.value }}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          envs: IMAGE_TAG
          script: |
            set -eu
            cd /opt/tasktracker
            git fetch --tags --depth=1 origin
            git reset --hard "${IMAGE_TAG#sha-}" 2>/dev/null \
              || git reset --hard "${IMAGE_TAG}" \
              || git reset --hard origin/main

            echo "::group::pre-deploy backup"
            ./scripts/pg-backup.sh || { echo "BACKUP FAILED — aborting"; exit 1; }
            echo "::endgroup::"

            echo "::group::pull images"
            docker pull "ghcr.io/${{ github.repository_owner }}/task-tracker-api:${IMAGE_TAG}"
            docker pull "ghcr.io/${{ github.repository_owner }}/task-tracker-scheduler:${IMAGE_TAG}"
            echo "::endgroup::"

            echo "::group::stack deploy"
            set -a; . ./.env.prod; set +a
            export IMAGE_TAG
            docker stack deploy -c docker-stack.yml --with-registry-auth tasktracker
            echo "::endgroup::"

            echo "::group::wait for readiness"
            for i in $(seq 1 60); do
              if curl -fsS http://localhost/actuator/health/readiness >/dev/null; then
                echo "ready (try $i)"; exit 0
              fi
              sleep 2
            done
            echo "FAILED — rolling back"
            docker service rollback tasktracker_api
            docker service rollback tasktracker_scheduler
            exit 1
            echo "::endgroup::"
