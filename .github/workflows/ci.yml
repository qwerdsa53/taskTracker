name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_API: ghcr.io/${{ github.repository_owner }}/task-tracker-api
  IMAGE_SCHEDULER: ghcr.io/${{ github.repository_owner }}/task-tracker-scheduler

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Шаг 1: образ тегируется commit SHA (уникальный идентификатор сборки)
      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_API }}:${{ github.sha }}
            ${{ env.IMAGE_API }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Scheduler
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.scheduler
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_SCHEDULER }}:${{ github.sha }}
            ${{ env.IMAGE_SCHEDULER }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Шаг 3: записываем версию образа и окружение в лог сборки
      - name: Log release info
        if: github.event_name == 'push'
        run: |
          echo "### Release" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| api | \`${{ env.IMAGE_API }}:${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| scheduler | \`${{ env.IMAGE_SCHEDULER }}:${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| run | \`${{ github.run_number }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
