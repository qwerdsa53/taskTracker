events {}

http {
    include /etc/nginx/mime.types;

    # Proxy timeouts: short enough to retry quickly, long enough for slow handlers.
    proxy_connect_timeout      3s;
    proxy_send_timeout        15s;
    proxy_read_timeout        30s;

    # Resolver for Docker / Swarm DNS (built-in DNS at 127.0.0.11).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Resolve `api` lazily so nginx survives api restarts and rolling deploys.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;

        # If readiness is unhealthy, the upstream returns 503/connection-refused;
        # nginx forwards that to the client (no retry to the same broken upstream).
        proxy_next_upstream error timeout http_502 http_503 http_504;

        location /api/ {
            set $backend "api:8080";
            proxy_pass http://$backend;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /ws {
            set $backend "api:8080";
            proxy_pass http://$backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_read_timeout 3600s;
        }

        location /actuator {
            set $backend "api:8080";
            proxy_pass http://$backend;
            proxy_set_header Host $host;
        }

        location /swagger-ui {
            set $backend "api:8080";
            proxy_pass http://$backend;
            proxy_set_header Host $host;
        }

        location /v3/api-docs {
            set $backend "api:8080";
            proxy_pass http://$backend;
            proxy_set_header Host $host;
        }

        location /graphql {
            set $backend "api:8080";
            proxy_pass http://$backend;
            proxy_set_header Host $host;
        }

        location = /healthz {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }
}
