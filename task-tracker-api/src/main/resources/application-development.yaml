# Shared dev/staging-style profile (remote Postgres, etc.). Env vars required in CI.
spring:
  config:
    activate:
      on-profile: development
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tasktracker}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
logging:
  level:
    org.springframework.web: INFO
