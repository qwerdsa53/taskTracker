spring:
  config:
    activate:
      on-profile: development
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tasktracker}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create
logging:
  level:
    org.springframework.web: INFO
