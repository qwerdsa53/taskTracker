# Integration / E2E tests: Postgres on DB_INTEGRATION_PORT (default 5433), see docker-compose postgres-integration.
app:
  mail:
    enabled: false

spring:
  config:
    activate:
      on-profile: integration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_INTEGRATION_PORT:5433}/${DB_NAME:tasktracker}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
logging:
  level:
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
