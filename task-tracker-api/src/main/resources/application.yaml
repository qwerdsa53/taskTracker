server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  tomcat:
    connection-timeout: 5s
    keep-alive-timeout: 15s

spring:
  application:
    name: taskTracker
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  config:
    # Swarm/Compose secrets are mounted as files in /run/secrets/.
    # Each file's name becomes a Spring property whose value is the file contents.
    import: "optional:configtree:/run/secrets/"
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:25s}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mail:
    host: ${MAIL_HOST:smtp.yandex.ru}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.ssl.enable]": true
      "[mail.smtp.ssl.trust]": ${MAIL_HOST:smtp.yandex.ru}
    default-encoding: UTF-8
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:create}
    properties:
      hibernate:
        default_batch_fetch_size: 16

springdoc:
  api-docs:
    version: OPENAPI_3_0
  swagger-ui:
    path: /swagger-ui.html
  packages-to-scan: edu.mirea.qwerdsa53.taskTracker.api.web

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-use-at-least-32-chars-secret-key-for-hs256}
    access-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-ttl: ${JWT_REFRESH_TTL:7d}
  openapi:
    title: Task Tracker API
    description: REST API under /api/v1
    version: 0.0.1
    redirect-root-to-swagger: true
  mail:
    enabled: ${APP_MAIL_ENABLED:true}
    from-address: ${MAIL_FROM:${MAIL_USERNAME:}}
    verification-token-ttl: ${MAIL_VERIFICATION_TOKEN_TTL:24h}
    verification-base-url: ${APP_VERIFICATION_BASE_URL:http://localhost:8080}
    verification:
      subject: "Confirm email — Task Tracker"

logging:
  structured:
    format:
      console: ${LOG_STRUCTURED_FORMAT:ecs}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
