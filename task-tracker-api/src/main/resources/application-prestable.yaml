# Pre-stable / staging. Set DB_HOST, DB_NAME, DB_USER, DB_PASSWORD in the environment.
spring:
  config:
    activate:
      on-profile: prestable
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:tasktracker}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
logging:
  level:
    root: INFO
