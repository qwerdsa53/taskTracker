# Unit tests with H2; use with @ActiveProfiles("testing").
app:
  mail:
    enabled: false
  jwt:
    secret: test-secret-key-minimum-32-characters-long!!

spring:
  config:
    activate:
      on-profile: testing
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
  flyway:
    enabled: false
  datasource:
    url: jdbc:h2:mem:tasktracker;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
